<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>

   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- link to JS -->
    <script src="main.js"></script>

    <!-- Add style -->
    <link rel="stylesheet" type="text/css" href="styles.css">

    </head>
    <body>
    <h1>Section Checker</h1>
    <hr>
    <div class="container">
      <label for="name">Enter Libary Section:</label>
      <input type="text" class="form-control" id="lib-sec" placeholder="enter F,N,R">

            <p id="result-lib-sec"></p>

     
      <div class="row">
    <button type="button" class="btn btn-primary" onclick="checklibsec()">Check</button> <!The onclick value has to be the same with the function name
    <button type="button" class="btn btn-primary" onclick="window.location.reload()">Refresh</button>  
    </div>
    <script>
      function checklibsec() {
        var section=document.getElementById('lib-sec').value;
        
        switch(section){
            case "F":
              document.getElementById('result-lib-sec').innerHTML="Fiction";
              break;

             case "N":
              document.getElementById('result-lib-sec').innerHTML = "Non Fiction";
              break;

             case "R":
              document.getElementById('result-lib-sec').innerHTML="Reference";
              break;

             default: 
             document.getElementById('result-lib-sec').innerHTML="Try again";
        }
      }
    </script>
